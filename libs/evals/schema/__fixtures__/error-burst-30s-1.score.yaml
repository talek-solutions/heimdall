        reason: Payments latency is up 151%.
    evidence:
      - r15
      - r18
      - r17
      - r12
      - r20
      - r4
      - r1
    confidence: 0.9
    mitigations:
      - tier: immediate
        action: Check Stripe's status page and raise an incident with Stripe. Meanwhile,
          let customers know payment is degraded, or switch on a backup
          processor if one is set up.
        tradeoff: We can't fix this ourselves. A failover means a different processor,
          which can change fees and fraud rules.
      - tier: short-term
        action: In payments, add a circuit breaker and retries with jittered exponential
          backoff on provider 5xx responses, using idempotency keys. Have
          checkout queue or defer the charge and keep the order and stock
          reservation, instead of failing the request outright.
        tradeoff: Deferred charges mean we take some orders that may not get paid, which
          adds reconciliation and fraud exposure. Retrying more also makes
          checkout slower.
      - tier: prevention
        action: Set up multi-provider payment routing. Alert on provider-call error
          ratio. Fill the missing provider-call throughput and latency metrics
          in payments' client instrumentation, plus the missing checkout metrics
          for UPDATE orders.
        tradeoff: A second provider costs more to integrate and run and needs its own
          compliance work. More metrics mean more instrumentation to maintain.
