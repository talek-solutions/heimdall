judgeInput:
  reference:
    outcome: cause-found
    origin: step:place-order#5
    cause: component:payment-provider
    mechanism: The external payment provider answers 502 for about 30 seconds, so
      payments' calls to it fail and every checkout that charges a card fails
      with them. Inventory and orders-pg are healthy; the errors start at the
      deepest failing hop, payments to the provider.
    evidence:
      - the checkout KPI dips about 25 seconds before the anchor, and the
        place-order p99 stays under its 1s SLO
      - steps 1 (POST /api/checkout), 4 (POST /charges) and 5 (payments to the
        provider) show errors; steps 2 and 3 are healthy
      - payments' logs show the provider's 502 Bad Gateway, and its error spans
        end at POST /v1/payment_intents
      - payment-provider is a blind spot, so the conclusion rests on payments'
        view of it
  conclusion:
    outcome: cause-found
    summary: "Starting at 07:59:35Z, the card processor (api.stripe.com) began
      returning 502 Bad Gateway to payments' POST /v1/payment_intents calls,
      failing up to 62% of them. Payments ran out of retries and sent 502s back
      to checkout, so about 19% of POST /api/checkout requests failed, latency
      went up and successful checkouts fell about 20%. Stripe sends us no
      telemetry of its own, so this rests on payments' client-side view of it:
      its metrics, spans and logs."
    cause:
      vertex: component:payment-provider
      mechanism: The external card processor api.stripe.com started answering
        payment-intent requests with 502 Bad Gateway at 07:59:35Z. Payments'
        retry budget ran out and the failures passed up through POST /charges to
        checkout.
    origin:
      step: step:place-order#5
      uncertain: false
    verdicts:
      - result: r1
